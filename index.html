<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacuna — estude com ciência</title>
<style>
  :root{
    --ink:#171310;
    --card-face:#f3ead9;
    --rule:#3a332b;
    --rule-light:#4d443a;
    --clay:#c1652f;
    --clay-dim:#5c3a24;
    --paper-dim:#9c9082;
    --ok:#7c9a6e;
    --ok-dim:#3a4632;
    --bad:#b25a4a;
    --bad-dim:#4a2c25;
    --hard:#c9a24a;
    --hard-dim:#4a3d20;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--ink);
    color:var(--card-face);
    font-family:"Iowan Old Style","Georgia",serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:36px 20px 60px;}
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--rule); padding-bottom:14px; margin-bottom:32px;
  }
  .brand{font-size:15px; letter-spacing:0.14em; text-transform:uppercase; font-weight:600;}
  .brand span{color:var(--clay);}
  .tagline{font-family:"SF Mono","Menlo",monospace; font-size:11px; color:var(--paper-dim);}

  .screen{display:none;}
  .screen.active{display:block;}

  .panel{border:1px solid var(--rule); padding:20px; border-radius:2px; margin-bottom:20px; background:#1c1712;}
  .field-label{
    font-family:"SF Mono","Menlo",monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--paper-dim); margin-bottom:10px;
  }
  .dropzone{
    border:1px dashed var(--rule-light); border-radius:2px; padding:26px 16px;
    text-align:center; background:#171310; transition:border-color .15s, background .15s;
  }
  .dropzone.drag{border-color:var(--clay); background:#241a10;}
  .dz-text{font-family:"SF Mono","Menlo",monospace; font-size:12px; color:var(--paper-dim);}
  .dz-link{color:var(--clay); text-decoration:underline; cursor:pointer;}
  .dz-status{margin-top:10px; font-family:"SF Mono","Menlo",monospace; font-size:11px; color:var(--paper-dim); min-height:14px;}
  .dz-status.err{color:var(--bad);}
  .dz-status.ok{color:var(--clay);}
  .or-divider{
    text-align:center; font-family:"SF Mono","Menlo",monospace; font-size:10px; color:var(--paper-dim);
    margin:14px 0; text-transform:uppercase; letter-spacing:0.1em;
  }
  .drive-row{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .remember-row{
    display:flex; align-items:center; gap:6px; font-family:"SF Mono","Menlo",monospace;
    font-size:11px; color:var(--paper-dim); margin-bottom:4px;
  }
  .due-note{
    font-family:"SF Mono","Menlo",monospace; font-size:11px; color:var(--paper-dim);
    text-align:center; padding:16px 0; line-height:1.7;
  }
  textarea, input[type=text]{
    width:100%; background:#171310; border:1px solid var(--rule-light);
    color:var(--card-face); font-family:"SF Mono","Menlo",monospace; font-size:13px; line-height:1.6;
    padding:12px; border-radius:2px;
  }
  textarea{min-height:100px; resize:vertical;}
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--clay);}
  .btn{font-family:"SF Mono","Menlo",monospace; cursor:pointer; border:none; border-radius:2px;}
  .btn-primary{
    background:var(--clay); color:#1c1006; font-size:13px; font-weight:700;
    letter-spacing:0.05em; text-transform:uppercase; padding:13px 26px; margin-top:14px; width:100%;
  }
  .btn-primary:hover{background:#d5763c;}
  .btn-primary:disabled{background:var(--rule-light); color:var(--paper-dim); cursor:not-allowed;}
  .btn-ghost{
    background:transparent; color:var(--paper-dim); border:1px solid var(--rule);
    font-size:12px; padding:12px 16px;
  }
  .btn-ghost:hover{color:var(--card-face); border-color:var(--rule-light);}

  .howto{
    font-family:"SF Mono","Menlo",monospace; font-size:11px; color:var(--paper-dim); line-height:1.8;
    border-left:2px solid var(--clay-dim); padding:2px 0 2px 14px; margin-bottom:24px;
  }
  .howto b{color:var(--clay);}

  .method-note{
    font-family:"SF Mono","Menlo",monospace; font-size:10.5px; color:var(--paper-dim); line-height:1.7;
    background:#1c1712; border:1px solid var(--rule); border-radius:2px; padding:14px 16px; margin-bottom:20px;
  }
  .method-note b{color:var(--clay);}
